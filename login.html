<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

  <script src="login.js"></script>
</head>
<body>
  <div class="login-cabecera">
    <div class="logo-box">
      <i class="fa-solid fa-shield-heart"></i>
    </div>
    <h1>MedPortal</h1>
  </div>

  <div class="login-container">
    <div class="descripcion-inicio">
      <h2 class="titulo-inicio">Bienvenido de nuevo</h2>
            <p class="subtitulo-inicio">Por favor, autentíquese para acceder al portal de proveedores.</p>
      
      <form> 
        <div class="form-group">
          <label for="username">Nombre de usuario</label>
          <div class="input">
            <input type="text" id="username" name="username" placeholder="Ingrese ID de admin" required>
          </div>  
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input">
            <input type="password" id="password" name="password" placeholder="**********"required>
          </div>
        </div>
      <button type="submit" class="boton-IniciarSesion">Iniciar Sesión</button>
     </form>
    </div>

    <footer class="pie-pagina">
      <strong>Solo Acceso Seguro:</strong> Este sistema es para personal médico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.
    </footer>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Productos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard_style.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <div class="dashboard-container">
    <header>
      <span>Admin Portal</span>
      <div>
        <button id="menuBtn" class="menu">&#9776;</button>
      </div>
    </header>
    <nav id="sidebar">
      <ul>
        <li><a href="#">Panel</a></li>
        <li><a href="prueba.html">Doctores</a></li>
        <li><a href="#">Especialidades</a></li>
        <li><a href="#">Busqueda de Pacientes</a></li>
      </ul>
      
    </nav>
    <main>
      <div id="titulo">
        <div id ="textos">
          <label>Vista General de Gestión</label>
          <label style="font-size: x-small;" for="">configure el personal medico y las especialidades del departamento</label>
        </div>
        <div id="botones">
          <button id="addPDoctortBtn">Agregar Doctor</button>
          <button id="addSpecialidadBtn">Agregar Especialidad</button>
        </div>

      </div>
      <div id="cards">
        <div class="card">
          <h3>DOCTORES ACTIVOS</h3>
          <p>Descripción del card 1</p>
        </div>
        <div class="card">
          <h3>ESPECIALIDADES ACTIVAS</h3>
          <p>Descripción del card 2</p>
        </div>
        <div class="card">
          <h3>TURNOS CONFIRMADOS PARA HOY</h3>
          <p>Descripción del card 3</p>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Especialidad</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="product-table-body">
          <!-- Los productos se cargarán aquí dinámicamente -->
        </tbody>
      </table>
    </main>
    <footer>
      <div>
        <button id="config">Configuraciones</button>
        <button id="logout">Cerrar Sesión</button>
      </div>
      Mi Aplicación &copy; 2024
    </footer>
  </div>
</body>
</html>
